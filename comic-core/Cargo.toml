[package]
name = "comic-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "comic_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
thiserror = "2"
flate2 = "1"
encoding_rs = "0.8"
jni = "0.21"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
crc32fast = "1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
