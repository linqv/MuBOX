[package]
name = "comic-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "comic_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
thiserror = "2"
flate2 = "1"
jni = "0.21"
once_cell = "1"

[dev-dependencies]
crc32fast = "1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
