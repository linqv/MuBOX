[package]
name = "comic-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "comic_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
thiserror = "2"
flate2 = "1"
encoding_rs = "0.8"
jni = "0.21"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "0.21.0", default-features = false }
sha2 = "0.10"

[dev-dependencies]
crc32fast = "1"
sevenz-rust2 = { version = "0.21.0", default-features = false, features = ["compress"] }
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
